<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* 1dp = 2px; v10 布局预览 */
  body { background:#1a1a2e; margin:0; padding:24px; display:flex; gap:24px;
         font-family:'Segoe UI',system-ui,sans-serif; }
  .stage { background:#333a4d; width:420px; height:640px; border-radius:8px;
           position:relative; overflow:hidden; box-shadow:0 0 0 2px #555; }
  .panel { position:absolute; left:24px; top:60px; width:200px;
           background:linear-gradient(135deg,#101B33,#060B16); border-radius:16px;
           padding:4px 14px 10px 14px; color:#fff; }
  .toprow { display:flex; align-items:center; padding:8px 0; }
  .title { font-weight:bold; font-size:15px; flex:1; }
  .dot { font-size:14px; color:#34d399; margin-right:12px; }
  .ghost { color:#94a3b8; font-weight:bold; font-size:16px; padding:6px 2px 6px 10px; }
  .hint { font-size:11px; color:#475569; padding-bottom:4px; }
  .volrow { display:flex; align-items:center; }
  .volbtn { width:32px; height:28px; background:linear-gradient(135deg,#3B82F6,#1D4ED8);
            border-radius:8px; display:flex; align-items:center; justify-content:center;
            font-size:16px; font-weight:bold; }
  .voltext { flex:1; text-align:center; font-size:21px; font-weight:bold; }
  .level { height:5px; background:#0B1426; border-radius:4px; margin-top:8px; overflow:hidden; }
  .levelfill { width:35%; height:100%; border-radius:4px;
               background:linear-gradient(90deg,#22D3EE,#34D399); }
  .btnrow { display:flex; margin-top:10px; }
  .btn { flex:1; height:44px; border-radius:10px; display:flex; align-items:center;
         justify-content:center; font-size:15px; font-weight:bold; }
  .btn.blue { background:linear-gradient(135deg,#3B82F6,#1D4ED8); }
  .btn.orange { background:linear-gradient(135deg,#FB923C,#C2410C); margin-left:8px; }
  .btn.gray { background:linear-gradient(135deg,#334155,#1E293B); margin-top:8px; }
  .chips { display:flex; margin-top:8px; gap:6px; }
  .chip { padding:7px 14px; background:#1E293B; border-radius:18px; font-size:13px;
          white-space:nowrap; }
  .footrow { display:flex; justify-content:flex-end; margin-top:2px; }
  .upd { color:#64748b; font-size:12px; padding:8px 2px 2px; }
  .bubble { position:absolute; left:160px; top:270px; width:100px; height:100px;
            border-radius:50%; background:linear-gradient(135deg,rgba(59,130,246,.8),rgba(29,78,216,.8));
            display:flex; align-items:center; justify-content:center; font-size:42px; }
  .lbl { color:#9ab; font-size:12px; margin:0 0 6px; }
</style></head>
<body>
<div class="stage">
  <div class="lbl" style="position:absolute;left:12px;top:10px">v10: ±蓝色块再缩一档 · 删掉"…"</div>
  <div class="panel">
    <div class="toprow"><span class="title">喊话台</span><span class="dot">●</span>
      <span class="ghost">—</span><span class="ghost">✕</span></div>
    <div class="hint">未在喊话</div>
    <div class="volrow"><div class="volbtn">−</div><div class="voltext">45%</div><div class="volbtn">+</div></div>
    <div class="level"><div class="levelfill"></div></div>
    <div class="btnrow"><div class="btn blue">开始喊话</div><div class="btn orange">开始录音</div></div>
    <div class="btn gray">录 音 库</div>
    <div class="chips"><div class="chip">让开</div><div class="chip">过来</div><div class="chip">警告</div></div>
    <div class="footrow"><span class="upd">检查更新</span></div>
  </div>
</div>
</body></html>
