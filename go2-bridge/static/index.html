<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Go2 遥控台</title>
<style>
:root{
  --bg:#F5F6FA; --panel:#FFFFFF; --sub:#FAFBFC; --well:#F3F4F6; --line:#E5E7EB;
  --border-medium:#D1D5DB;
  --txt:#1F2937; --dim:#6B7280;
  --ok:#10B981; --warn:#F59E0B; --bad:#EF4444; --accent:#3B82F6;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05); --shadow-md:0 4px 6px -1px rgba(0,0,0,.1);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  min-height:100dvh; background:var(--bg); color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  display:flex; flex-direction:column; align-items:center;
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  overscroll-behavior:none;
  padding:calc(env(safe-area-inset-top) + 10px) 16px calc(16px + env(safe-area-inset-bottom));
  transition:padding .25s;
}
/* 重连横幅滑入时给内容让位, 不盖住页头 */
body.reconnecting{padding-top:calc(env(safe-area-inset-top) + 52px)}
.num{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
     font-variant-numeric:tabular-nums}
button{font-family:inherit; touch-action:manipulation}

header{width:100%;max-width:640px;display:flex;align-items:center;
       justify-content:space-between;padding:14px 2px 10px;gap:8px}
h1{font-size:14px;margin:0;letter-spacing:.14em;color:var(--dim);font-weight:600;white-space:nowrap}
h1 b{color:var(--txt);letter-spacing:.04em}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);
      border-radius:999px;padding:4px 10px;background:var(--panel);
      border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 6px #10B98155}
.dot.warn{background:var(--warn)}
.dot.bad{background:var(--bad)}

.banner{position:fixed;top:0;left:0;right:0;background:#FEF3C7;color:#92400E;
        border-bottom:1px solid #FCD34D;font-size:13px;text-align:center;
        padding:9px 12px;z-index:9;
        transform:translateY(-100%);transition:transform .25s}
body.reconnecting .banner{transform:none}

main{width:100%;max-width:640px;display:flex;flex-direction:column;
     align-items:center;justify-content:center;gap:18px;flex:1}
.taken{width:100%;text-align:center;font-size:13px;color:#92400E;
       border-radius:999px;padding:8px 12px;background:#FEF3C7;
       border:1px solid #FCD34D}

.pads{display:flex;gap:clamp(18px,5vw,56px);margin-top:4px}
.block{display:flex;flex-direction:column;align-items:center;gap:8px}
.pad{position:relative;width:clamp(168px,42vw,238px);aspect-ratio:1;border-radius:50%;
     background:radial-gradient(circle at 50% 42%,#FFFFFF,#F3F4F6 72%);
     border:1px solid var(--border-medium);
     touch-action:none;
     box-shadow:var(--shadow-md)}
.pad::before{content:"";position:absolute;inset:0;border-radius:50%;
     background:linear-gradient(#1F293712,#1F293712) 50% 50%/1px 100% no-repeat,
                linear-gradient(#1F293712,#1F293712) 50% 50%/100% 1px no-repeat}
.pad::after{content:"";position:absolute;left:50%;top:50%;width:66%;aspect-ratio:1;
     transform:translate(-50%,-50%);border-radius:50%;border:1px solid #1F29371A}
.dead{position:absolute;left:50%;top:50%;width:11%;aspect-ratio:1;
     transform:translate(-50%,-50%);border-radius:50%;border:1px dashed #1F293726}
.stick{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;border-radius:50%;
     transform:translate(-50%,-50%);pointer-events:none;
     background:radial-gradient(circle at 38% 32%,#FFFFFF,#D1D5DB 65%);
     border:1px solid var(--border-medium,#D1D5DB);box-shadow:0 4px 14px #00000026;
     transition:transform .14s}
.pad.on .stick{transition:none;border-color:var(--accent);box-shadow:0 0 16px #3B82F645}
.readout{display:flex;gap:14px;font-size:12px;color:var(--dim);min-height:1.2em}
.readout b{color:var(--txt);font-weight:500;min-width:5.5ch;display:inline-block}
.cap{font-size:12px;color:var(--dim);letter-spacing:.08em}

.row{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;justify-content:center}
.seg{display:flex;background:var(--well);border:1.5px solid var(--line);
     border-radius:999px;overflow:visible;padding:3px;gap:4px}
.seg button{flex:1;appearance:none;border:none;background:transparent;color:var(--dim);
     font-size:15px;padding:12px 20px;cursor:pointer;border-radius:999px;
     font-weight:500;transition:all .2s}
.seg button.on{background:var(--panel);color:var(--accent);font-weight:600;
     box-shadow:0 1px 3px rgba(0,0,0,.1),0 0 0 1px rgba(59,130,246,.2)}
.toggle{appearance:none;background:var(--panel);color:var(--txt);
     border:1.5px solid var(--line);border-radius:999px;font-size:15px;
     padding:12px 24px;cursor:pointer;font-weight:600;transition:all .2s}
.toggle.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.toggle:hover{background:var(--well)}
.toggle.on:hover{background:#2563EB}

.estop{width:100%;max-width:640px;appearance:none;border:0;border-radius:16px;
     background:var(--bad);color:#fff;font-size:18px;font-weight:700;
     letter-spacing:.22em;padding:16px;cursor:pointer;box-shadow:var(--shadow-md)}
.estop:active{background:#DC2626}

.tip{font-size:12px;color:var(--dim);text-align:center;line-height:1.8;
     max-width:460px;margin:0}

body.offline .pad,body.offline .seg,body.offline .toggle,
body.offline .estop{opacity:.35;pointer-events:none}
</style>
</head>
<body>
<div class="banner" id="banner">连接断开，正在重连…</div>
<header>
  <h1><b>GO2</b> 遥控台</h1>
  <div class="chips">
    <span class="chip"><span class="dot" id="dLink"></span><span id="tLink">连接中</span></span>
    <span class="chip"><span class="dot" id="dSbus"></span>SBUS</span>
    <span class="chip"><span class="dot" id="dCtl"></span><span id="tCtl">控制权 —</span></span>
  </div>
</header>
<main>
  <div class="taken" id="taken" hidden>遥控器已接管 —— 本页控制暂停，摇杆与按钮不生效</div>
  <section class="pads">
    <div class="block">
      <div class="pad" id="L"><span class="dead"></span><div class="stick"></div></div>
      <div class="readout num">vx <b id="vVx">+0.00</b> vy <b id="vVy">+0.00</b></div>
      <div class="cap">左 · 前后 / 左右</div>
    </div>
    <div class="block">
      <div class="pad" id="R"><span class="dead"></span><div class="stick"></div></div>
      <div class="readout num">vyaw <b id="vYy">+0.00</b></div>
      <div class="cap">右 · 转向</div>
    </div>
  </section>
  <section class="row">
    <div class="seg" id="modeSeg">
      <button data-m="0">趴下</button>
      <button data-m="1">站立</button>
      <button data-m="2">行走</button>
    </div>
    <button class="toggle" id="armBtn">解锁</button>
  </section>
  <button class="estop" id="estop">急停 · 趴下</button>
  <p class="tip" id="hint" style="color:var(--warn);min-height:1.4em"></p>
  <p class="tip">流程：解锁 → 站立 → 行走，再拖摇杆。遥控器解锁时本页不生效；关闭本页会自动停走（保持站姿）。</p>
</main>
<script>
const $ = id => document.getElementById(id);
const fmt = v => (v >= 0 ? '+' : '') + v.toFixed(2);
let ws = null, retry = 0, hintTimer = null;
const send = o => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };
const buzz = p => { try { navigator.vibrate(p); } catch (e) {} };
// tok: 板上 config.WEB_TOKEN 非空时, 页面必须带 ?tok=<串> 才能遥控(10-29 鉴权)
const WS_TOK = new URLSearchParams(location.search).get('tok') || '';

function connect(){
  ws = new WebSocket(`ws://${location.host}/ws${WS_TOK ? '?tok=' + encodeURIComponent(WS_TOK) : ''}`);
  ws.onopen = () => { retry = 0;
    document.body.classList.remove('reconnecting', 'offline'); send({ping:1}); };
  ws.onmessage = e => render(JSON.parse(e.data));
  /* 只让 onclose 排重连: onerror 后必跟 onclose, 两个都排会每轮翻倍 */
  ws.onerror = () => document.body.classList.add('reconnecting', 'offline');
  ws.onclose = () => {
    document.body.classList.add('reconnecting', 'offline');
    setTimeout(connect, Math.min(1000 * ++retry, 5000));
  };
}
if (location.host){
  connect();
} else {
  $('banner').textContent = '请通过 http://板子IP:8000 打开本页';
  document.body.classList.add('reconnecting');
}
setInterval(() => send({ping:1}), 800);

function dot(el, cls){ el.className = 'dot' + (cls ? ' ' + cls : ''); }
function render(s){
  /* 指令被明确拒绝(如起立中请求站立/行走): 显示原因, 3s 后淡出, 不清本地状态 */
  if (s && s.err){
    $('hint').textContent = s.msg || ('指令被拒绝: ' + s.err);
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => { $('hint').textContent = ''; }, 3000);
    return;
  }
  if (s.link === 'up'){ dot($('dLink'),'ok'); $('tLink').textContent = '狗在线'; }
  else if (s.link === 'connecting'){ dot($('dLink'),'warn'); $('tLink').textContent = '狗连接中'; }
  else if (s.link === 'lib_missing'){ dot($('dLink'),'bad'); $('tLink').textContent = '驱动未装'; }
  else { dot($('dLink'),'bad'); $('tLink').textContent = '狗离线'; }
  dot($('dSbus'), s.sbus ? 'ok' : '');
  dot($('dCtl'), s.rc ? 'warn' : (s.web ? 'ok' : ''));
  $('tCtl').textContent = '控制权 ' + (s.rc ? '遥控器' : (s.web ? '网页' : '—'));
  $('taken').hidden = !s.rc;
  document.querySelectorAll('#modeSeg button').forEach(b =>
    b.classList.toggle('on', +b.dataset.m === s.mode));
  const armed = s.web && !s.rc;
  $('armBtn').classList.toggle('on', armed);
  $('armBtn').textContent = armed ? '上锁' : '解锁';
}

document.querySelectorAll('#modeSeg button').forEach(b => b.onclick = () => {
  const m = +b.dataset.m;
  send({cmd: m === 0 ? 'damp' : (m === 1 ? 'stand' : 'walk')});
  buzz(8);
});
$('armBtn').onclick = () => {
  send({cmd: $('armBtn').classList.contains('on') ? 'disarm' : 'arm'});
  buzz(12);
};
$('estop').onclick = () => { send({cmd:'damp'}); buzz([30,40,30]); };

const zeros = [];
function pad(id, fn){
  const el = $(id), st = el.querySelector('.stick');
  let on = false;
  const set = e => {
    const r = el.getBoundingClientRect(), R = r.width / 2, lim = R - st.offsetWidth / 2;
    let dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + R);
    const m = Math.hypot(dx, dy);
    if (m > lim){ dx *= lim / m; dy *= lim / m; }
    st.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    let nx = dx / lim, ny = dy / lim;
    if (Math.hypot(nx, ny) < 0.15){ nx = 0; ny = 0; }
    fn(nx, ny);
  };
  const zero = () => {
    if (!on) return;
    on = false; el.classList.remove('on');
    st.style.transform = 'translate(-50%,-50%)';
    fn(0, 0);
  };
  el.addEventListener('pointerdown', e => {
    on = true; el.classList.add('on'); el.setPointerCapture(e.pointerId); set(e);
  });
  el.addEventListener('pointermove', e => { if (on) set(e); });
  el.addEventListener('pointerup', zero);
  el.addEventListener('pointercancel', zero);
  el.addEventListener('contextmenu', e => e.preventDefault());
  zeros.push(zero);
}
pad('L', (x, y) => { send({vx: -y, vy: -x});   /* 只发自己的键: 桥端缺键不清零, 双杆可叠加 */
  $('vVx').textContent = fmt(-y); $('vVy').textContent = fmt(-x); });
pad('R', (x, y) => { send({vyaw: -x});
  $('vYy').textContent = fmt(-x); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) zeros.forEach(f => f());
});
</script>
</body>
</html>
